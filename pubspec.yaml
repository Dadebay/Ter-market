name: atlas
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  #==================== FIREBASE ====================#
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.3
  flutter_local_notifications: ^18.0.1

  #==================== STATE MANAGEMENT ====================#
  get: ^4.7.2

  #==================== NETWORK ====================#
  http:
  web_socket_channel: ^3.0.3
  socket_io_client: ^3.0.2
  flutter_slidable: ^3.1.0

  #==================== UI & UX ====================#
  pull_to_refresh: ^2.0.0
  flutter_staggered_grid_view: ^0.7.0
  dotted_border: ^2.1.0
  hugeicons: ^0.0.11
  cupertino_icons: ^1.0.8
  lottie: ^3.1.0
  upgrader: ^10.3.0
  in_app_update: 4.2.2

  #==================== LOCAL STORAGE ====================#
  get_storage: ^2.1.1

  #==================== UTILITIES ====================#
  kartal: ^3.5.0
  intl: ^0.20.2
  url_launcher: ^6.2.1
  latlong2: ^0.9.1
  flutter_map: ^8.1.1
  file_picker: ^9.2.1 # TODO: remove

  #==================== MEDIA ====================#
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  change_app_package_name: ^1.5.0
  flutter_svg: ^2.0.10+1
  flutter_launcher_icons: ^0.14.4
  table_calendar: ^3.1.2
  # easy_localization: ^3.0.7

  #==================== DOWNLOAD ====================#
  dio: ^5.4.0
  saver_gallery: ^3.0.0
  permission_handler: ^11.3.0
  location: 8.0.0
  path: ^1.9.0
  feather_icons: ^1.2.0
  iconly: ^1.0.1
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  location_platform_interface: 6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
        - asset: assets/fonts/Gilroy-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilroy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Bold.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-Regular.ttf
        - asset: assets/fonts/Ubuntu-Light.ttf
          weight: 300
        - asset: assets/fonts/Ubuntu-Medium.ttf
          weight: 500
        - asset: assets/fonts/Ubuntu-Bold.ttf
          weight: 700
    - family: Gotham
      fonts:
        - asset: assets/fonts/gotham_book.otf
        - asset: assets/fonts/gotham_thin.otf
          weight: 100
        - asset: assets/fonts/gotham_light.otf
          weight: 200
        - asset: assets/fonts/gotham_medium.otf
          weight: 300
        - asset: assets/fonts/gotham_book.otf
          weight: 400
        - asset: assets/fonts/gotham_bold.otf
          weight: 800
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
