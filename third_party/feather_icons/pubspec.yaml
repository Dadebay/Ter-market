name: feather_icons
description: Feather Icons font compatibility copy for current Flutter.
version: 1.2.0+flutter3
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: Feather
      fonts:
        - asset: fonts/feather.ttf
